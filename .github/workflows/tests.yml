name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a constraint renamed in meraki/schema surfaces as a stale key here
    # without waiting for somebody to edit a message.
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      # This package contains no PHP. meraki/schema is a dev dependency so schema-lang can read
      # the vocabulary off the library's own classes and check every message against it — which is
      # what stands in for a compiler when a package is nothing but data.
      #
      # `dev-main` rather than a tagged constraint, deliberately, while 2.0 is in alpha. The
      # vocabulary is still moving, and the weekly run below exists to notice when it does: a
      # pinned tag would hold this pack against a snapshot and report nothing until somebody
      # bumped it. Swap to `^2.0` once 2.0 is stable and the keys stop changing.
      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Validate composer.json
        run: composer validate --strict

      - name: Check the pack
        run: vendor/bin/schema-lang validate .
